[package]
name = "logline"
version = "0.1.0"
license = "MIT"
edition = "2021"
description = "Logline: bets on the line, settled by the logs. Prediction markets on on-chain metrics."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
